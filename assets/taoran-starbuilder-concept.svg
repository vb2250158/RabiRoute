<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2200" viewBox="0 0 1600 2200" role="img" aria-labelledby="title desc">
  <title id="title">Taoran — Xinghai Builder concept preview</title>
  <desc id="desc">An original black, blue, and white anime-inspired construction guide character concept.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#07142e"/><stop offset="1" stop-color="#102f64"/></linearGradient>
