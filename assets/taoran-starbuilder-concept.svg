    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101426"/><stop offset=".66" stop-color="#161d38"/><stop offset=".67" stop-color="#e9f3ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="86" height="86" patternUnits="userSpaceOnUse"><path d="M0 0H86V86H0Z" fill="none" stroke="#79b8ff" stroke-opacity=".22" stroke-width="2"/></pattern>
  </defs>
  <rect width="1600" height="2200" fill="url(#sky)"/>
  <rect width="1600" height="2200" fill="url(#grid)" opacity=".65"/>
