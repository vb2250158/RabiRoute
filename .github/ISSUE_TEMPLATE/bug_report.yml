name: Bug report
description: Something behaves differently from what the docs describe
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先确认两件事：

        1. 版本号取自 `/meta` 或界面「关于」，不是凭印象写的。
        2. 看过[能力矩阵](../../docs/current-capabilities.md)的状态标注 —— 标着「实验支持」的功能需要按各自环境验收，未必是 bug。
  - type: input
    id: version
    attributes:
      label: 版本
      description: `/meta` 返回的 version，或界面「关于」里显示的版本
      placeholder: "0.15.24"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 出问题的部分
      options:
        - 消息入口（QQ / 微信 / 企业微信 / 飞书）
        - Agent 处理端投递
        - 路由或发送规则
        - 角色、计划或记忆
        - WebGUI
        - 安装或启动
        - 其他
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 你以为会发生什么
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际发生了什么
      description: 有报错就把原文贴上来，不要只写「失败了」
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 提交前先脱敏 —— 去掉 token、群号、手机号和私有路径
    validations:
      required: false
