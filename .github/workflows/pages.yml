name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/rabiroute-hero-connections.webp"
      - "assets/rabiroute-icon.png"
      - "assets/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site/assets
          cp -r site/. _site/
          cp assets/rabiroute-hero-connections.webp _site/assets/
          cp assets/rabiroute-icon.png _site/assets/
          cp assets/screenshots/*.png _site/assets/
          ls _site/assets | head -20

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
