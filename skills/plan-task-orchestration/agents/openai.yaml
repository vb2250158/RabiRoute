interface:
  display_name: "计划与任务会话编排"
  short_description: "为 RabiRoute 计划查重、绑定唯一任务会话并持续推进到验收"
  default_prompt: "任何可能修改 目标项目的任务，都先使用 $plan-task-orchestration 完成 RabiRoute 计划查重和唯一任务绑定，再开始业务调查。绑定已存在的任务会话时直接 PATCH 计划的 taskBinding（agentType、sessionId、workspace，DSH 另带 baseUrl），不要用线程桥 action=create 冒充绑定；确需新建时必须显式传 agentAdapter 和 cwd，否则会被建成 Codex 任务并落到默认工作区。If-Match 与 Idempotency-Key 只用 ASCII，中文头会被客户端直接拒绝。绑定后回读计划的 taskBinding 核对 agentType、sessionId 和 workspace。分析按证据进入 roles.informationNeeded 或 roles.approval，待审批表示方案已形成、准备实施但尚未实施，通常审批一个明确方案是否执行；待补充信息表示暂时无法形成方案，需要用户补充影响判断的事实或决定。收到补充后先回到分析中，重新核对，再判断继续补充信息还是形成方案待审批，不能直接跳到审批或执行。普通修复不默认生成 A／B；玩法设计、美术候选等任务本身需要比较设计时，才按实际需要提供成熟候选，不用候选掩盖调查不足。信息充分且定位准确的小 Bug 直接形成方案，不为走流程要求用户补资料。Agent 判断下一步需要改动项目代码、预制体、美术资源或配置时，先进入待审批，不能以“小改动”或“验证猜测”为由先改项目。用户已明确批准同一具体修改时按授权范围执行，不重复审批；隔离草稿或设计候选不算已经修改项目。不把待审批设为固定终点：关键事实不足则写明已知、未知和补证动作；证据充分且方案明确才申请审批。审批正文先讲逻辑怎么变，再列代码文件／方法、预制体对象／绑定、配置表／ID／字段各改什么；只写实际涉及项，用完整主谓宾说明谁对哪个具体对象做什么，保留对象所属功能及必要条件；不堆术语，不强制双方案。先核对当前需求、已有修复和用户最新结论，不为旧问题编新需求；真实备选写成独立questions选项，互斥方案用单选、可组合的选项用多选，不同事项或模块按需分题决定，并提供保持现状或修改建议。明确拒绝后不重提，未选项不视为批准。各题或候选用implementation保存实际修改的代码逻辑、预制体、美术和配置明细，界面默认折叠；单一方案不要求alternatives。风险、验证和回退保留在技术详情。批准或直接授权后进入 roles.execution；仍可自主调查时继续 roles.analysis。开发侧完成但缺目标包或纳入证明时用 roles.waitingPackage；目标包确认但缺 QA 结论时用 roles.waitingQa；问题无效或历史已修复且无需验收时凭证据写 roles.closed。审批备注或验收失败退回分析；批量并行处理独立工作，派发完整工作包，同轮回填并续投；已授权计划内常规同步与 SVN 提交不建立重复审批。Rabi 或 Manager 不可用时，先通过 Host READY 或源码 READY 重新发现当前 generation 地址并核对 `/meta`，禁止固定端口、端口扫描、旧实例锁和直接启动 Manager；仍不可用或目录不存在时，把计划调整、实际修改、验证、SVN revision 和剩余事项写入 `RabiPlanCache/pending/`，随后继续已授权业务工作。Rabi 恢复后语义查重并同步真实计划，取得 `planId` 和 Manager 回读后再移入 `synced/`；缓存不替代真实计划，也不阻断项目交付。严格只读且不会形成或执行改动时不触发。"
