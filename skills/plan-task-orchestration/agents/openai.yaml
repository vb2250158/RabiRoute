interface:
  display_name: "计划与任务会话编排"
  short_description: "查重、续接原任务并完成验收"
  default_prompt: "使用 $plan-task-orchestration 核对原计划、taskBinding、工作区和当前步骤。按用户已有授权连续调查、实施、验证与交付。动态发现 Manager，使用正式 API 与完整任务 ID；原请求待确认时按原 deliveryId 核对接收。Manager 故障时将阶段变化记入 RabiPlanCache/pending/，继续独立工作，恢复后回写原计划。业务选择待决定时准备具体选项。"
