interface:
  display_name: "计划与任务会话编排"
  short_description: "为 RabiRoute 计划查重、绑定唯一任务会话并持续推进到验收"
  default_prompt: "使用 $plan-task-orchestration 为一个 RabiRoute 计划查重并绑定唯一 Codex 任务，按 调查中 → 信息不足/待审批 → 执行中 → 待验收 推进：调查先写清证据、原因、具体改法和验证；信息不足时列出负责人必须补充的材料；审批备注退回调查；执行完成进入适用验收路径。批量并行处理独立工作，同轮回填并续投；PangHu 计划内常规同步与 SVN 提交不建立重复审批。"
