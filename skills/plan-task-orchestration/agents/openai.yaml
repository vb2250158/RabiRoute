interface:
  display_name: "计划与任务会话编排"
  short_description: "为 RabiRoute 计划查重、绑定唯一任务会话并持续推进到验收"
  default_prompt: "任何可能修改 PangHu 项目的任务，都先使用 $plan-task-orchestration 完成 RabiRoute 计划查重和唯一任务绑定，再开始业务调查。按 分析中 → 待补充信息/待审批 → 执行中 → 待验收 推进：分析写清证据、原因、具体改法、影响和验证；分析结束仍缺关键事实时，把 plan.status 写为 roles.informationNeeded 指向的 key，并列出负责人必须补充的材料；审批备注或验收失败退回分析；执行完成进入适用验收路径。批量并行处理独立工作，派发完整工作包，同轮回填并续投；PangHu 计划内常规同步与 SVN 提交不建立重复审批。Rabi 或 Manager 不可用时，先通过 Host READY 或源码 READY 重新发现当前 generation 地址并核对 `/meta`，禁止固定端口、端口扫描、旧实例锁和直接启动 Manager；仍不可用或目录不存在时，把计划调整、实际修改、验证、SVN revision 和剩余事项写入 `RabiPlanCache/pending/`，随后继续已授权业务工作。Rabi 恢复后语义查重并同步真实计划，取得 `planId` 和 Manager 回读后再移入 `synced/`；缓存不替代真实计划，也不阻断项目交付。严格只读且不会形成或执行改动时不触发。"
