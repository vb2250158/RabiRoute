plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def mobileSlim = project.hasProperty("mobileSlim")
def rokidVideo = project.hasProperty("rokidVideo") || project.hasProperty("videoAcceptance")

android {
    namespace "com.rabi.link"
    compileSdk 34

    def velaDebugKeystore = rootProject.file("signing/vela-debug.p12")
    def restoredDebugKeystore = rootProject.file("secrets/rokid/signing/debug.keystore")
    def rokidAiSdkAssetsDir = rootProject.file("out/reference/RokidAiSdkDemo/app/src/main/assets")

    signingConfigs {
        restoredDebug {
            storeFile restoredDebugKeystore
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        velaDebug {
            storeFile velaDebugKeystore
            storeType "pkcs12"
            storePassword "rabiroute"
            keyAlias "vela-debug"
            keyPassword "rabiroute"
            enableV1Signing false
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }

    defaultConfig {
        applicationId "com.rabi.link"
        if (project.hasProperty("videoAcceptance")) applicationIdSuffix ".videoacceptance"
        minSdk 31
        targetSdk 34
        testInstrumentationRunner "com.rabi.link.test.DirectVideoInstrumentation"
        // The thin-phone package must always be an installable upgrade over
        // the prior diagnostic build.  Keep the normal build metadata intact.
        versionCode mobileSlim ? 41 : 4
        versionName mobileSlim ? "0.3.38-dev" : "0.3.1"
        buildConfigField "boolean", "MOBILE_SLIM", mobileSlim ? "true" : "false"
        buildConfigField "boolean", "ROKID_VIDEO", (!mobileSlim || rokidVideo) ? "true" : "false"
        buildConfigField "String", "BUILD_TIME", "\"${new Date().format("yyyy-MM-dd HH:mm:ss Z")}\""
    }

    buildTypes {
        debug {
            if (restoredDebugKeystore.exists()) {
                signingConfig signingConfigs.restoredDebug
            } else if (velaDebugKeystore.exists()) {
                signingConfig signingConfigs.velaDebug
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    // The companion APK is required for automatic glasses streaming. Reference
    // models and phone-side legacy ABIs remain excluded from the slim build.
    sourceSets {
        main {
            java.srcDir("$buildDir/generated/mobileTheme/java")
            res.srcDir("$buildDir/generated/mobileTheme/res")
            jniLibs.srcDir("$rootDir/out/live-recorder/jniLibs")
            assets.srcDir("$rootDir/out/live-recorder/assets")
            java.srcDir("$rootDir/../../packages/android-sdk/rabiroute-sdk/src/main/java")
            java.srcDir("$rootDir/shared/src/main/java")
            if (!mobileSlim && rokidAiSdkAssetsDir.exists()) {
                assets.srcDir(rokidAiSdkAssetsDir)
            }
        }
        debug {
            assets.srcDir("$buildDir/generated/assets/glassVideo/debug")
            if (!mobileSlim) assets.srcDir("$buildDir/generated/assets/glassApp/debug")
        }
    }

    if (mobileSlim) {
        defaultConfig {
            ndk { abiFilters "arm64-v8a" }
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging = true }
        pickFirst "lib/armeabi-v7a/librlog.so"
        pickFirst "lib/armeabi-v7a/libcaps.so"
        pickFirst "lib/armeabi-v7a/libflora-cli.so"
    }
}

tasks.register("prepareLiveRecorderRuntime", Exec) {
    workingDir rootProject.projectDir
    commandLine "node", "scripts/Prepare-LiveRecorderRuntime.mjs"
}
tasks.register("generateMobileTheme", Exec) {
    workingDir rootProject.projectDir
    commandLine "node", "scripts/generate-mobile-theme.mjs"
    inputs.files(rootProject.file("../../ribiwebgui/src/themes/light/tokens.css"), rootProject.file("../../ribiwebgui/src/themes/dark/tokens.css"), rootProject.file("scripts/generate-mobile-theme.mjs"))
    outputs.dir("$buildDir/generated/mobileTheme")
}
tasks.named("preBuild").configure { dependsOn("prepareLiveRecorderRuntime", "generateMobileTheme") }

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.register("copyGlassAppDebugApk", Copy) {
    dependsOn(":glass-app:assembleDebug")
    from(rootProject.file("glass-app/build/outputs/apk/debug/glass-app-debug.apk"))
    into("$buildDir/generated/assets/glassApp/debug")
    rename { "rabi-glass-debug.apk" }
}

tasks.matching { it.name == "mergeDebugAssets" }.configureEach {
    if (!mobileSlim) dependsOn("copyGlassAppDebugApk")
    dependsOn("copyGlassVideoDebugApk")
}
tasks.register("copyGlassVideoDebugApk", Copy) {
    dependsOn(":glass-video-app:assembleDebug")
    from(rootProject.file("glass-video-app/build/outputs/apk/debug/glass-video-app-debug.apk"))
    into("$buildDir/generated/assets/glassVideo/debug")
    rename { "rabi-glass-video.apk" }
}

dependencies {
    implementation "androidx.media3:media3-exoplayer:1.3.1"
    implementation "androidx.media3:media3-exoplayer-rtsp:1.3.1"
    implementation "androidx.media3:media3-ui:1.3.1"
    implementation "io.github.webrtc-sdk:android-prefixed:144.7559.09"
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "androidx.activity:activity-ktx:1.7.2"
    implementation "androidx.health.connect:connect-client:1.1.0-alpha07"
    implementation "com.rokid.cxr:client-l:1.1.0"
    if (mobileSlim) {
        // Camera streaming needs the Phone SDK at runtime. Inference-only
        // diagnostic libraries below remain compile-only; RabiPC owns ASR/TTS.
        if (rokidVideo) {
            implementation("com.rokid.security:phone.sdk:2.5.1-P") {
                exclude group: "org.slf4j"
            }
        } else {
            compileOnly("com.rokid.security:phone.sdk:2.5.1-P") {
                exclude group: "org.slf4j"
            }
        }
        compileOnly(name: "basic-1.4.3", ext: "aar")
        compileOnly(name: "turenso-1.4.3", ext: "aar")
        compileOnly(name: "nlpconsumer-1.4.3", ext: "aar")
        compileOnly(name: "audioai-1.4.3", ext: "aar")
    } else {
        implementation("com.rokid.security:phone.sdk:2.5.1-P") {
            exclude group: "org.slf4j"
        }
        implementation(name: "basic-1.4.3", ext: "aar")
        implementation(name: "turenso-1.4.3", ext: "aar")
        implementation(name: "nlpconsumer-1.4.3", ext: "aar")
        implementation(name: "audioai-1.4.3", ext: "aar")
    }
    implementation "org.slf4j:slf4j-api:1.7.36"
    implementation "com.google.code.gson:gson:2.8.5"
    implementation "io.reactivex.rxjava2:rxjava:2.1.12"
    testImplementation "junit:junit:4.13.2"
    // Android provides org.json at runtime; local JVM tests need its implementation explicitly.
    testImplementation "org.json:json:20231013"
}
